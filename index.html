<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종테크 - POS & KIOSK 전문 기업</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; text-align: center; color: #333; }
        header { background: #1a252f; color: white; padding: 60px 20px; }
        h1 { margin: 0; font-size: 2.5em; }
        p { font-size: 1.2em; color: #ddd; }
        .content { padding: 50px 20px; max-width: 80px; margin: auto; }
        .card-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        footer { background: #f4f4f4; padding: 20px; font-size: 0.9em; color: #666; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>세종테크</h1>
        <p>POS, 카드 단말기 & 키오스크 맞춤 설치 전문</p>
    </header>
    <div class="content">
        <h2>주요 서비스</h2>
        <div class="card-container">
            <div class="card">
                <h3>POS 시스템</h3>
                <p>매장 맞춤형 신속하고 안정적인 POS 설치 및 유지보수</p>
            </div>
            <div class="card">
                <h3>카드 단말기</h3>
                <p>유/무선 단말기 빠른 승인 및 매장 맞춤 세팅</p>
            </div>
            <div class="card">
                <h3>무인 키오스크</h3>
                <p>무인 매장, 카페, 식당 최적화 키오스크 솔루션</p>
            </div>
        </div>
    </div>
    <footer>
        <p>© 세종테크. All rights reserved.</p>
    </footer>
</body>
</html>
