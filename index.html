<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종테크 - POS & KIOSK 전문 기업</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; color: #333; line-height: 1.6; background-color: #fff; }
        
        /* 상단 헤더 */
        header { background: #1a252f; color: white; padding: 50px 20px; text-align: center; }
        header h1 { font-size: 2.2rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; color: #cbd5e1; }
        
        /* 메인 컨테이너 */
        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        .section-title { font-size: 1.8rem; margin-bottom: 40px; color: #1e293b; }
        
        /* 카드 영역 (가로 정렬) */
        .card-container { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
        .card { 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 30px 20px; 
            flex: 1; 
            min-width: 250px; 
            max-width: 300px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { font-size: 1.3rem; margin-bottom: 15px; color: #0f172a; }
        .card p { color: #64748b; font-size: 0.95rem; word-break: keep-all; }
        
        /* 하단 푸터 */
        footer { background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 30px 20px; text-align: center; font-size: 0.85rem; color: #64748b; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>세종테크</h1>
        <p>POS, 카드 단말기 & 키오스크 맞춤 설치 전문</p>
    </header>

    <div class="container">
        <h2 class="section-title">주요 서비스</h2>
        <div class="card-container">
            <div class="card">
                <h3>POS 시스템</h3>
                <p>매장 맞춤형 신속하고 안정적인 POS 설치 및 유지보수</p>
            </div>
            <div class="card">
                <h3>카드 단말기</h3>
                <p>유/무선 단말기 빠른 승인 및 매장 맞춤 세팅</p>
            </div>
            <div class="card">
                <h3>무인 키오스크</h3>
                <p>무인 매장, 카페, 식당 최적화 키오스크 솔루션</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 세종테크. All rights reserved.</p>
    </footer>
</body>
</html>
